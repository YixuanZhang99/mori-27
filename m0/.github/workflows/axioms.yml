name: governed-evolution-acceptance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test and host dependencies
        run: python3 -m pip install pytest dacite openai pyyaml numpy
      - name: Static axiom gate
        run: python3 ci/check_axioms.py
      - name: Current versioned acceptance
        run: python3 verifier/v57/verify.py
