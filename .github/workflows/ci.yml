name: Development and Linux acceptance

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Run only the temporary continuation performance diagnostic
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic && '-diagnostic' || '' }}
  cancel-in-progress: false

jobs:
  macos-portable:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.diagnostic) }}
    name: macOS / Python 3.12 / portable checks
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.6.8'
          enable-cache: true
          cache-dependency-glob: m0/uv.lock
      - name: Install locked Python environment
        run: make setup PYTHON=3.12
      - name: Portable checks with explicit Linux deselection and no skips
        run: |
          mkdir -p artifacts/macos
          set -o pipefail
          make check 2>&1 | tee artifacts/macos/check.log
      - name: Confirm historical certificates were not modified
        if: always()
        run: git diff --exit-code -- m0/verifier
      - name: Upload portable check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-portable-${{ github.sha }}
          path: artifacts/macos/
          if-no-files-found: warn
          retention-days: 14
  linux-acceptance:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.diagnostic) }}
    name: Linux x86_64 / Python 3.12 / full v76
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UV_PROJECT_ENVIRONMENT: /usr/local/share/mori27-venv
      UV_PYTHON: /usr/bin/python3.12
      UV_PYTHON_DOWNLOADS: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked uv tool version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.6.8'
          enable-cache: true
          cache-dependency-glob: m0/uv.lock
      - name: Prepare Linux execution prerequisites
        run: bash scripts/setup_linux_ci.sh
      - name: Install locked Python environment
        run: make setup PYTHON=/usr/bin/python3.12
      - name: Verify original import provenance
        run: make verify-import
      - name: Build distributable packages
        run: make build
      - name: Acceptance wrapper regressions
        run: make tooling
      - name: Offline examples
        run: make examples
      - name: Prepare fast private temporary directory for acceptance
        run: bash scripts/setup_ci_tmpdir.sh
      - name: Full acceptance with no skipped tests
        run: |
          export MORI_TEST_OFFLINE_CACHE="$(uv cache dir)"
          make accept-linux
      - name: Confirm historical certificates were not modified
        if: always()
        run: git diff --exit-code -- m0/verifier
      - name: Upload acceptance evidence and packages
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-acceptance-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
  mle-cloud-runtime:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.diagnostic) }}
    name: MLE CPU dependencies / pinned official graders / synthetic data
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      UV_PYTHON_DOWNLOADS: never
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openai/mle-bench
          ref: 507f92e1138bb6e40dac5c6ee7a6758e6424bf97
          path: artifacts/mle-smoke-official
          lfs: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.6.8'
      - name: Install hash-locked CPU dependencies into a separate environment
        run: |
          sudo install -d -m 0755 -o "$(id -un)" -g "$(id -gn)" /usr/local/share/mori27-mle-smoke
          uv venv --python /usr/bin/python3.12 /usr/local/share/mori27-mle-smoke
          uv pip install --python /usr/local/share/mori27-mle-smoke/bin/python --require-hashes -r scripts/requirements-mle-pilot.lock
      - name: Verify official runtime without credentials or real datasets
        env:
          PYTHONPATH: ${{ github.workspace }}/m0:${{ github.workspace }}/artifacts/mle-smoke-official
        run: |
          /usr/local/share/mori27-mle-smoke/bin/python scripts/verify_mle_cloud_runtime.py \
            --official-root artifacts/mle-smoke-official --report artifacts/mle-runtime/report.json
      - name: Upload synthetic runtime verification only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mle-runtime-${{ github.sha }}
          path: artifacts/mle-runtime/report.json
          if-no-files-found: warn
          retention-days: 14
  continuation-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.diagnostic }}
    name: Temporary Linux continuation performance diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_PROJECT_ENVIRONMENT: /usr/local/share/mori27-venv
      UV_PYTHON: /usr/bin/python3.12
      UV_PYTHON_DOWNLOADS: never
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked uv tool version
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.6.8'
          enable-cache: true
          cache-dependency-glob: m0/uv.lock
      - name: Prepare Linux execution prerequisites
        run: bash scripts/setup_linux_ci.sh
      - name: Install locked Python environment
        run: make setup PYTHON=/usr/bin/python3.12
      - name: Prepare fast private temporary directory for diagnostic
        run: bash scripts/setup_ci_tmpdir.sh
      - name: Profile the in-process continuation case
        run: |
          mkdir -p artifacts/continuation-diagnostic
          export MORI_TEST_OFFLINE_CACHE="$(uv cache dir)"
          git rev-parse HEAD | tee artifacts/continuation-diagnostic/commit.txt
          set -o pipefail
          cd m0
          uv run --locked python -m cProfile -o ../artifacts/continuation-diagnostic/pytest.prof -m pytest \
            -vv -s --durations=0 -o faulthandler_timeout=120 \
            -p no:cacheprovider --strict-markers --fail-on-skip \
            tests/test_openevolve_continuation_evolve.py \
            2>&1 | tee ../artifacts/continuation-diagnostic/inprocess.log
      - name: Summarize available profile
        if: always()
        run: |
          set -o pipefail
          if [[ -f artifacts/continuation-diagnostic/pytest.prof ]]; then
            uv run --project m0 --locked python - <<'PY' | tee artifacts/continuation-diagnostic/profile.txt
          import pstats
          profile = pstats.Stats('artifacts/continuation-diagnostic/pytest.prof')
          profile.strip_dirs().sort_stats('cumulative').print_stats(60)
          profile.sort_stats('tottime').print_stats(40)
          PY
          else
            printf '%s\n' 'Profiler did not finish; use the live pytest progress and faulthandler stacks.'
          fi
      - name: Upload the first profile before remaining cases
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: continuation-profile-${{ github.sha }}
          path: artifacts/continuation-diagnostic/
          if-no-files-found: warn
          retention-days: 14
      - name: Diagnose the remaining five cache-enabled integration cases
        if: always()
        run: |
          mkdir -p artifacts/continuation-diagnostic
          export MORI_TEST_OFFLINE_CACHE="$(uv cache dir)"
          set -o pipefail
          cd m0
          uv run --locked python -m pytest \
            -vv -s --durations=0 -o faulthandler_timeout=120 \
            -p no:cacheprovider --strict-markers --fail-on-skip \
            tests/test_openevolve_continuation_frozen_worker.py \
            tests/test_openevolve_continuation_reference_evolve.py \
            tests/test_openevolve_continuation_paired.py \
            tests/test_openevolve_governed_framework.py::test_mori_control_and_main_use_same_locked_runtime \
            tests/test_openevolve_host_control.py::test_seed_control_and_dispatch_share_the_campaign_runtime \
            2>&1 | tee ../artifacts/continuation-diagnostic/remaining.log
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: continuation-diagnostic-${{ github.sha }}
          path: artifacts/continuation-diagnostic/
          if-no-files-found: warn
          retention-days: 14
